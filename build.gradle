plugins {
    id "architectury-plugin" version "3.4.162"
    id "dev.architectury.loom" version "1.10.437" apply false
    id "com.modrinth.minotaur" version "2.8.7" apply false
    id "net.darkhax.curseforgegradle" version "1.1.25" apply false
}

ext.latestChangelog = {
    def text = file("CHANGELOG.md").text
    def end = text.indexOf("***")
    (end >= 0 ? text.substring(0, end) : text).trim()
}

tasks.register("publishModrinth") {
    group = "publishing"
    dependsOn ":fabric:modrinth", ":neoforge:modrinth"
}

tasks.register("publishCurseForge") {
    group = "publishing"
    dependsOn ":fabric:curseforge", ":neoforge:curseforge"
}

tasks.register("publishAll") {
    group = "publishing"
    dependsOn "publishModrinth", "publishCurseForge"
}

subprojects {
    apply plugin: "dev.architectury.loom"
    loom { silentMojangMappingsLicense() }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://maven.blamejared.com/" }
        maven { url = "https://www.cursemaven.com" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.architectury.dev/" }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 21
    }


    java { withSourcesJar() }
}
