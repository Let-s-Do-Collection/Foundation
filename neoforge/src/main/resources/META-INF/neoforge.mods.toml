modLoader = "javafml"
loaderVersion = "[4,)"
license = "Custom"
issueTrackerURL = "https://github.com/satisfyu/Let-s-Do-Hub"

[[mixins]]
config = "foundation-neoforge.mixins.json"

[[mixins]]
config = "foundation-common.mixins.json"

[[mods]]
modId = "foundation"
version = "${version}"
displayName = "[Let's Do] Foundation"
authors = "satisfy"
logoFile = "pack.png"
displayURL = "https://www.lets-do.ch"
description = '''
The shared heart of all Let's Do mods. Look at a block and see what to do next, sit on chairs and sofas, fill shelves that show their items, enjoy food with effects, fireflies around lanterns at night and the Completionist Banner. Keeps every Let's Do mod looking and playing the same.

Website: https://www.lets-do.ch
Source: https://github.com/Let-s-Do-Collection/Foundation
Issues: https://github.com/satisfyu/Let-s-Do-Hub
'''

[[dependencies.foundation]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.foundation]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.foundation]]
modId = "architectury"
type = "required"
versionRange = "[13.0.8,)"
ordering = "AFTER"
side = "BOTH"
