modLoader = "javafml"
loaderVersion = "[4,)"
license = "Custom"
issueTrackerURL = "https://github.com/satisfyu/Let-s-Do-Hub"

[[mixins]]
config = "foundation-neoforge.mixins.json"

[[mixins]]
config = "foundation-common.mixins.json"

[[mods]]
modId = "foundation"
version = "${version}"
displayName = "[Let's Do] Foundation"
authors = "satisfy"
description = '''
The shared core library of the Let's Do mods: HUD panels, tooltips, seats, storage, food, armor, wood and more.
Bundled with every Let's Do mod, no manual install needed.
'''
logoFile = "pack.png"
displayURL = "https://www.lets-do.ch"

[[dependencies.foundation]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.foundation]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.foundation]]
modId = "architectury"
type = "required"
versionRange = "[13.0.8,)"
ordering = "AFTER"
side = "BOTH"
